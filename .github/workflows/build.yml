name: Hitachi build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hitachi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify ROMs and build with bundled Hitachi
        run: python3 tools/build.py check
      - uses: actions/upload-artifact@v6
        with:
          name: hitachi-evidence
          path: |
            build/proof.json
            build/mapping.json
            build/work/*.elf
            build/work/*.map
            build/work/*.src
            build/work/*.log
            build/work/*.lnk
            build/progress.json
            build/progress.svg
            build/active.svg
            build/index.html
