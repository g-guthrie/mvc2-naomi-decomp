name: Hitachi build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hitachi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify ROMs and build with bundled Hitachi
        run: python3 tools/build.py check
      - uses: actions/upload-artifact@v6
        with:
          name: hitachi-evidence
          path: |
            build/proof.json
            build/mapping.json
            build/work/*.elf
            build/work/*.map
            build/work/*.src
            build/work/*.log
            build/work/*.lnk
            build/progress.json
            build/progress.svg
            build/active.svg
            build/index.html
      - name: Publish canonical README bars
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'A newer main commit exists; its workflow will publish the bars.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update canonical progress bars [skip ci]'
            git push origin HEAD:main
          fi
